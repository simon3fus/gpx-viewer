<title>Girona GPX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;height:100dvh;display:flex;flex-direction:column}

/* ── HEADER ── */
#header{background:#12122a;border-bottom:1px solid #2a2a4a;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#header h1{font-size:17px;font-weight:700;letter-spacing:-.3px;color:#f0f0f0}
#header span{font-size:12px;color:#555}

/* ── LAYOUT ── */
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-height:0;z-index:0}

/* ── BOTTOM PANEL ── */
#panel{background:#fff;border-top:1px solid #e0e0e0;display:flex;flex-direction:column;max-height:52vh;overflow:hidden}

/* ── ELEVATION ── */
#elev-wrap{display:none;border-bottom:1px solid #f0f0f0;padding:10px 14px 6px;flex-shrink:0}
#elev-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#elev-title{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.4px}
#elev-canvas{width:100%;height:64px;display:block;cursor:crosshair}
#elev-tooltip{font-size:11px;color:#888;height:14px;margin-top:2px}

/* ── DETAIL ── */
#detail{display:none;padding:10px 14px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
#detail-name{font-size:14px;font-weight:600;margin-bottom:8px}
#detail-stats{display:flex;gap:0;flex-wrap:nowrap;overflow-x:auto}
.dstat{flex:1;min-width:64px;text-align:center;padding:4px 0}
.dstat .v{font-size:16px;font-weight:600;color:#111}
.dstat .l{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}

/* ── ROUTE LIST ── */
#route-list{overflow-y:auto;flex:1}
.route-item{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .12s;gap:11px;user-select:none}
.route-item:hover{background:#fafafa}
.route-item.active{background:#f0f4ff}
.rdot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.rinfo{flex:1;min-width:0}
.rname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstats{display:flex;gap:8px;margin-top:2px}
.rs{font-size:11px;color:#777}
.dl-btn{flex-shrink:0;padding:5px 9px;background:#f2f2f2;border:none;border-radius:5px;font-size:11px;cursor:pointer;color:#444;white-space:nowrap;transition:background .12s}
.dl-btn:hover{background:#e4e4e4}

@media(min-width:700px){
  #main{flex-direction:row}
  #map{flex:1}
  #panel{width:300px;max-height:none;border-top:none;border-left:1px solid #2a2a4a}
  #elev-canvas{height:72px}
}
</style>

document.getElementById('hdr-count').textContent = ROUTES.length + ' Route' + (ROUTES.length !== 1 ? 'n' : '');

// ── STATS ──────────────────────────────────────────────────
function calcStats(pts) {
  let dist=0, up=0, down=0;
  const R=6371000;
  for (let i=1;i<pts.length;i++) {
    const [la,lo,ea]=pts[i-1], [lb,lb2,eb]=pts[i];
    const dLat=(lb-la)*Math.PI/180, dLon=(lb2-lo)*Math.PI/180;
    const s=Math.sin(dLat/2), c=Math.sin(dLon/2);
    dist+=2*R*Math.asin(Math.sqrt(s*s+Math.cos(la*Math.PI/180)*Math.cos(lb*Math.PI/180)*c*c));
    const de=eb-ea;
    if(de>0) up+=de; else down+=Math.abs(de);
  }
  return {dist:Math.round(dist), up:Math.round(up), down:Math.round(down),
    eleMin:Math.round(Math.min(...pts.map(p=>p[2]))),
    eleMax:Math.round(Math.max(...pts.map(p=>p[2])))};
}
const routes = ROUTES.map(r => ({ ...r, stats: calcStats(r.pts) }));

function fD(m){ return m>=1000?(m/1000).toFixed(1)+' km':m+' m' }
function fE(m){ return m+' m' }

// ── MAP ────────────────────────────────────────────────────
const map = L.map('map');
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{

  subdomains:'abcd', maxZoom:19
}).addTo(map);

const polylines = [];
const allLL = [];
routes.forEach((r,i) => {
  const ll = r.pts.map(p=>[p[0],p[1]]);
  allLL.push(...ll);
  const poly = L.polyline(ll,{color:r.color,weight:3,opacity:0.8}).addTo(map);
  polylines.push(poly);
  poly.on('click',()=>selectRoute(i));
  if(ll.length){
    const ic=L.divIcon({html:`<div style="width:9px;height:9px;background:${r.color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.35)"></div>`,className:'',iconAnchor:[4,4]});
    L.marker(ll[0],{icon:ic}).addTo(map);
  }
});
if(allLL.length) map.fitBounds(allLL,{padding:[20,20]});

// ── ELEVATION PROFILE ──────────────────────────────────────
const canvas = document.getElementById('elev-canvas');
const ctx = canvas.getContext('2d');
let elevHoverX = -1;
let currentRouteIdx = -1;

function drawElevation(r) {
  const wrap = document.getElementById('elev-wrap');
  wrap.style.display = 'block';
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);

  const eles = r.pts.map(p=>p[2]);
  const minE = Math.min(...eles), maxE = Math.max(...eles);
  const range = maxE - minE || 1;
  const pad = 4;

  ctx.clearRect(0,0,W,H);

  // gradient fill
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, r.color+'55');
  grad.addColorStop(1, r.color+'08');
  ctx.beginPath();
  eles.forEach((e,i) => {
    const x = pad + (i/(eles.length-1))*(W-2*pad);
    const y = H - pad - ((e-minE)/range)*(H-2*pad);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(W-pad, H); ctx.lineTo(pad, H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // line
  ctx.beginPath();
  eles.forEach((e,i) => {
    const x = pad + (i/(eles.length-1))*(W-2*pad);
    const y = H - pad - ((e-minE)/range)*(H-2*pad);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = r.color; ctx.lineWidth = 1.5; ctx.stroke();

  // hover line
  if(elevHoverX >= 0) {
    ctx.beginPath(); ctx.moveTo(elevHoverX,0); ctx.lineTo(elevHoverX,H);
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke();
    ctx.setLineDash([]);
  }

  document.getElementById('elev-range').textContent = minE+'m – '+maxE+'m';
}

canvas.addEventListener('mousemove', e => {
  if(currentRouteIdx<0) return;
  const r = routes[currentRouteIdx];
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const W = canvas.offsetWidth, H = canvas.offsetHeight, pad=4;
  const frac = Math.max(0, Math.min(1, (x-pad)/(W-2*pad)));
  const idx = Math.round(frac*(r.pts.length-1));
  const pt = r.pts[idx];
  const eles=r.pts.map(p=>p[2]), minE=Math.min(...eles), maxE=Math.max(...eles), range=maxE-minE||1;
  const cy = H - pad - ((pt[2]-minE)/range)*(H-2*pad);
  elevHoverX = x;
  document.getElementById('elev-tooltip').textContent = `${Math.round(pt[2])} m ü.M.`;
  drawElevation(r);
  ctx.beginPath(); ctx.arc(x,cy,4,0,Math.PI*2);
  ctx.fillStyle=r.color; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
});
canvas.addEventListener('mouseleave', ()=>{
  elevHoverX=-1;
  document.getElementById('elev-tooltip').textContent='';
  if(currentRouteIdx>=0) drawElevation(routes[currentRouteIdx]);
});

// ── SELECT / DESELECT ──────────────────────────────────────
let selected = -1;

function selectRoute(i) {
  if(selected===i){deselect();return;}
  selected=i; currentRouteIdx=i;
  polylines.forEach((p,j)=>p.setStyle({weight:j===i?5:2,opacity:j===i?1:0.25}));
  if(selected>=0) polylines[selected].bringToFront();
  document.querySelectorAll('.route-item').forEach((el,j)=>el.classList.toggle('active',j===i));
  showDetail(i);
  elevHoverX=-1;
  drawElevation(routes[i]);
  map.flyToBounds(polylines[i].getBounds(),{padding:[30,30],duration:0.5});
}

function deselect() {
  selected=-1; currentRouteIdx=-1;
  polylines.forEach(p=>p.setStyle({weight:3,opacity:0.8}));
  document.querySelectorAll('.route-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('detail').style.display='none';
  document.getElementById('elev-wrap').style.display='none';
}

function showDetail(i) {
  const r=routes[i], s=r.stats;
  const det=document.getElementById('detail');
  det.style.display='block';
  det.innerHTML=`<div id="detail-name">${r.name}</div>
  <div id="detail-stats">
    <div class="dstat"><div class="v">${fD(s.dist)}</div><div class="l">Distanz</div></div>
    <div class="dstat"><div class="v">↑ ${fE(s.up)}</div><div class="l">Aufstieg</div></div>
    <div class="dstat"><div class="v">↓ ${fE(s.down)}</div><div class="l">Abstieg</div></div>
    <div class="dstat"><div class="v">${fE(s.eleMin)}</div><div class="l">Min</div></div>
    <div class="dstat"><div class="v">${fE(s.eleMax)}</div><div class="l">Max</div></div>
  </div>`;
}

// ── ROUTE LIST ─────────────────────────────────────────────
const list=document.getElementById('route-list');
routes.forEach((r,i)=>{
  const el=document.createElement('div');
  el.className='route-item';
  el.innerHTML=`
    <div class="rdot" style="background:${r.color}"></div>
    <div class="rinfo">
      <div class="rname">${r.name}</div>
      <div class="rstats">
        <span class="rs">${fD(r.stats.dist)}</span>
        <span class="rs">↑${fE(r.stats.up)}</span>
        <span class="rs">↓${fE(r.stats.down)}</span>
      </div>
    </div>
    <button class="dl-btn" data-i="${i}">↓ GPX</button>`;
  el.addEventListener('click', e => {
    const btn = e.target.closest('.dl-btn');
    if (btn) {
      const r = routes[+btn.dataset.i];
      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Girona GPX" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>${r.name}</name><trkseg>
${r.pts.map(p=>`    <trkpt lat="${p[0]}" lon="${p[1]}"><ele>${p[2]}</ele></trkpt>`).join('\n')}
  </trkseg></trk>
</gpx>`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'}));
      a.download = r.name.replace(/\s+/g,'_') + '.gpx';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    selectRoute(i);
  });
  list.appendChild(el);
});

map.on('click',()=>{if(selected>=0)deselect();});
</script>
</body>
</html>
